name: Deploy PreProd to S3 and CloudFront

on:
  push:
    branches:
      - PreProd
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Vite project
        run: npm run build
        env:
          NODE_ENV: production
          VITE_PREPROD_URL: ${{ secrets.VITE_PREPROD_URL }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Sync dist folder to S3
        run: |
          # Upload static assets with long cache
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_PREPROD }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "*.json" \
            --content-type "application/javascript" \
            --exclude "*" \
            --include "*.js"
          
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_PREPROD }} \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*.html" \
            --exclude "*.json" \
            --exclude "*.js" \
            --exclude "*.css"
          
          # Upload CSS with correct content-type
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_PREPROD }} \
            --cache-control "public,max-age=31536000,immutable" \
            --content-type "text/css" \
            --exclude "*" \
            --include "*.css"
          
          # Upload HTML and JSON with short cache
          aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_PREPROD }} \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"
      
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PREPROD }} \
            --paths "/*"
      
      - name: Deployment complete
        run: echo "✅ Deployment successful! Your site is live."